<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Stack</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #000; background: #fff; margin: 0; }
  #top { border-bottom: 1px solid #999; padding: 8px 12px; background: #f2f2f2; }
  #top select, #top button { font-size: 14px; }
  #nav { padding: 6px 12px; border-bottom: 1px solid #ccc; }
  #nav a { margin-right: 14px; color: #00e; cursor: pointer; text-decoration: underline; }
  #nav a.on { color: #000; font-weight: bold; text-decoration: none; }
  #view { padding: 12px; max-width: 1200px; }
  h2 { font-size: 18px; margin: 0 0 8px 0; }
  h3 { font-size: 15px; margin: 16px 0 6px 0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  th, td { border: 1px solid #bbb; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: #eee; }
  textarea, input[type=text], select { font-family: inherit; font-size: 14px; }
  textarea { width: 100%; box-sizing: border-box; }
  .row { margin: 6px 0; }
  .muted { color: #555; }
  .err { color: #b00; }
  .ok { color: #060; }
  pre { white-space: pre-wrap; background: #f7f7f7; border: 1px solid #ccc; padding: 8px; }
  iframe { width: 100%; height: 640px; border: 1px solid #bbb; }
  label { display: inline-block; min-width: 190px; }
  details summary { cursor: pointer; color: #00e; }
</style>
</head>
<body>
<div id="top">
  Company:
  <select id="company" onchange="pick(this.value)"></select>
  <button onclick="go('setup')">New company</button>
  <span id="llm" class="muted" style="margin-left:12px"></span>
</div>
<div id="nav"></div>
<div id="view"></div>

<script>
const TABS = [
  ['setup', 'Setup'], ['profile', 'Company profile'], ['interview', 'Interview'], ['stack', 'Signal stack'],
  ['sources', 'Source manager'], ['feed', 'Intelligence feed'], ['brief', 'Monday brief'], ['settings', 'Settings'], ['runs', 'Runs and changes']
];
let cid = Number(localStorage.getItem('cid')) || null;
let tab = localStorage.getItem('tab') || 'setup';
let timer = null;

async function api(path, method = 'GET', body = null, isForm = false) {
  const opts = { method, headers: {} };
  if (body && !isForm) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (body && isForm) opts.body = body;
  const res = await fetch('/api' + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.detail) || res.statusText);
  return data;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const view = (html) => { $('view').innerHTML = html; };
const msg = (id, text, bad) => { const el = $(id); if (el) el.innerHTML = `<span class="${bad ? 'err' : 'muted'}">${esc(text)}</span>`; };

async function busy(id, label, fn) {
  msg(id, label + ' (this can take a while with a local model)...');
  try { const r = await fn(); msg(id, 'Done.'); return r; }
  catch (e) { msg(id, e.message, true); return null; }
}

function nav() {
  $('nav').innerHTML = TABS.map(([k, v]) => `<a class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${v}</a>`).join('');
}
function go(t) { tab = t; localStorage.setItem('tab', t); clearInterval(timer); nav(); render(); }

async function loadCompanies() {
  const list = await api('/companies');
  $('company').innerHTML = '<option value="">-- select --</option>' + list.map((c) => `<option value="${c.id}" ${c.id === cid ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  if (cid && !list.find((c) => c.id === cid)) cid = null;
}
function pick(v) { cid = v ? Number(v) : null; localStorage.setItem('cid', cid || ''); render(); }

async function init() {
  try { const h = await api('/health'); $('llm').textContent = `LLM: ${h.llm_provider} (${h.llm_reachable ? 'reachable' : 'NOT reachable'})`; } catch (e) {}
  await loadCompanies(); nav(); render();
}

function render() {
  if (!cid && tab !== 'setup') { view('<p>Select or create a company first.</p>'); return; }
  const fn = { setup: vSetup, profile: vProfile, interview: vInterview, stack: vStack, sources: vSources, feed: vFeed, brief: vBrief, settings: vSettings, runs: vRuns }[tab];
  fn();
}

async function vSetup() {
  let c = null;
  if (cid) c = await api('/companies/' + cid);
  view(`<h2>Company setup</h2>
  <div class="row"><label>Company name</label><input type="text" id="n" size="30" value="${c ? esc(c.name) : ''}"></div>
  <div class="row"><label>Website</label><input type="text" id="u" size="40" value="${c ? esc(c.url) : ''}"></div>
  <div class="row"><button onclick="createCompany()">Create company</button></div>
  <div id="m0"></div>
  ${c ? `<h3>Initial research</h3>
  <div class="row"><button onclick="doResearch()">Research website</button> <span class="muted">Reads the homepage and a few internal pages, respecting robots.txt.</span></div>
  <div id="m1"></div><div id="res">${researchHtml(c.research)}</div>
  <h3>Pipeline</h3>
  <div class="row muted">Counts: ${c.counts.sources_approved} approved sources, ${c.counts.items} collected records, ${c.counts.briefs} briefs.</div>
  <div class="row"><button onclick="doDiscover()">Discover sources and competitors</button> <button onclick="approveAll()">Approve all suggested sources</button></div>
  <div id="m2"></div>` : ''}`);
}
function researchHtml(r) {
  if (!r || !r.summary) return '<p class="muted">No research yet.</p>';
  const facts = (r.verified_facts || []).map((f) => `<tr><td>${esc(f.fact)}</td><td>"${esc(f.quote)}"</td><td><a href="${esc(f.evidence_url)}" target="_blank">${esc(f.evidence_url)}</a></td></tr>`).join('');
  const ass = (r.assumptions || []).map((a) => `<tr><td>${esc(a.assumption)}</td><td>${esc(a.basis)}</td></tr>`).join('');
  return `<p><b>Summary:</b> ${esc(r.summary)}</p>
  <p><b>Industry:</b> ${esc(r.industry)} &nbsp; <b>Positioning:</b> ${esc(r.positioning)}</p>
  <p><b>Products/services:</b> ${esc((r.products_services || []).join('; '))}</p>
  <p><b>Customer segments:</b> ${esc((r.customer_segments || []).join('; '))}</p>
  <h3>Verified facts (quote found on the crawled page)</h3>
  <table><tr><th>Fact</th><th>Quote</th><th>Source</th></tr>${facts || '<tr><td colspan=3>None verified.</td></tr>'}</table>
  <h3>Assumptions (not verified)</h3>
  <table><tr><th>Assumption</th><th>Basis</th></tr>${ass || '<tr><td colspan=2>None.</td></tr>'}</table>
  <p class="muted">Pages read: ${esc((r.pages_read || []).join(', '))}</p>`;
}
async function createCompany() {
  try {
    const r = await api('/companies', 'POST', { name: $('n').value, url: $('u').value });
    cid = r.id; localStorage.setItem('cid', cid); await loadCompanies(); vSetup();
  } catch (e) { msg('m0', e.message, true); }
}
async function doResearch() { const r = await busy('m1', 'Researching', () => api('/companies/' + cid + '/research', 'POST')); if (r) $('res').innerHTML = researchHtml(r); }
async function doDiscover() { const r = await busy('m2', 'Discovering sources', () => api('/companies/' + cid + '/discover', 'POST')); if (r) msg('m2', `Added ${r.added} sources. Review them in the Source manager, then approve.`); }
async function approveAll() { await api('/companies/' + cid + '/sources/approve-all', 'POST'); msg('m2', 'All suggested sources approved.'); }

async function vProfile() {
  const c = await api('/companies/' + cid);
  const p = c.profile || {};
  const ints = await api('/companies/' + cid + '/interview');
  const keys = Object.keys(p);
  view(`<h2>Company intelligence profile</h2>
  <p class="muted">Edit any field (one item per line) and save. Answers to interview questions can be edited on the Interview tab, which rebuilds this profile.</p>
  ${keys.length ? keys.map((k) => `<div class="row"><b>${esc(k)}</b><br><textarea data-k="${esc(k)}" rows="3">${esc((p[k] || []).join('\n'))}</textarea></div>`).join('') : '<p>No profile yet. Complete the interview.</p>'}
  ${keys.length ? '<button onclick="saveProfile()">Save profile</button> <span id="m3"></span>' : ''}
  <h3>Business context changed?</h3>
  <p class="muted">Describe what changed (for example a new market or product line). The system will retire sources that no longer fit, recommend new ones and explain the difference.</p>
  <textarea id="note" rows="3"></textarea>
  <div class="row"><button onclick="ctxChange()">Reassess signal stack</button></div>
  <div id="m4"></div><div id="chg"></div>`);
}
async function saveProfile() {
  const out = {};
  document.querySelectorAll('textarea[data-k]').forEach((t) => { out[t.dataset.k] = t.value.split('\n').map((s) => s.trim()).filter(Boolean); });
  try { await api('/companies/' + cid + '/profile', 'PUT', out); msg('m3', 'Saved.'); } catch (e) { msg('m3', e.message, true); }
}
async function ctxChange() {
  const r = await busy('m4', 'Reassessing', () => api('/companies/' + cid + '/context-change', 'POST', { note: $('note').value }));
  if (r) $('chg').innerHTML = changeHtml(r);
}
function changeHtml(r) {
  return `<h3>What changed</h3><p>${esc(r.what_changed)}</p>
  <h3>Retired sources</h3>${r.retired.length ? '<ul>' + r.retired.map((x) => `<li>Source ${x.id}: ${esc(x.why)}</li>`).join('') + '</ul>' : '<p>None.</p>'}
  <h3>Recommended new sources (suggested, need approval)</h3>${r.recommended_new.length ? '<ul>' + r.recommended_new.map((x) => `<li>[${esc(x.category)}] ${esc(x.name)}: ${esc(x.reason)}</li>`).join('') + '</ul>' : '<p>None.</p>'}`;
}

async function vInterview() {
  const s = await api('/companies/' + cid + '/interview');
  if (!s.started) {
    view(`<h2>Interview</h2><p>Questions are generated from the research on this company.</p>
    <button onclick="startInterview(false)">Start interview</button> <span id="m5"></span>`);
    return;
  }
  const hist = s.history.map((h) => `<div class="row"><b>${esc(h.question)}</b><br>${h.skipped ? '<span class="muted">(skipped)</span>' : `<textarea id="e${h.id}" rows="2">${esc(h.answer)}</textarea><br><button onclick="editAns(${h.id})">Save edit</button>`}</div>`).join('');
  const cur = s.next
    ? `<h3>Question ${s.answered + 1} of ${s.core_total}${s.followups_used ? ' (plus ' + s.followups_used + ' follow-up)' : ''}${s.next.is_followup ? ' - follow-up' : ''}</h3>
       <p><b>${esc(s.next.question)}</b></p><textarea id="ans" rows="4"></textarea>
       <div class="row"><button onclick="sendAns(${s.next.id}, false)">Submit answer</button> <button onclick="sendAns(${s.next.id}, true)">Skip (confidential)</button></div>`
    : '<h3>Interview complete</h3><p>Profile built. Review it on the Company profile tab.</p>';
  view(`<h2>Interview</h2><div id="m5"></div>${cur}<h3>Answered</h3>${hist || '<p class="muted">Nothing yet.</p>'}
  <div class="row"><button onclick="startInterview(true)">Restart with new questions</button></div>`);
}
async function startInterview(reset) {
  const r = await busy('m5', 'Generating questions', () => api('/companies/' + cid + '/interview/start?reset=' + reset, 'POST'));
  if (r) vInterview();
}
async function sendAns(id, skip) {
  const r = await busy('m5', skip ? 'Skipping' : 'Saving and checking for follow-ups', () => api('/companies/' + cid + '/interview/answer', 'POST', { question_id: id, answer: skip ? null : $('ans').value, skip }));
  if (r) vInterview();
}
async function editAns(id) { await busy('m5', 'Saving and rebuilding profile', () => api('/companies/' + cid + '/interview/' + id, 'PUT', { answer: $('e' + id).value })); }

async function vStack() {
  const st = await api('/companies/' + cid + '/stack');
  const names = { customers: 'Customers', competitors: 'Competitors', market: 'Market', internal: 'Internal' };
  view('<h2>Signal stack</h2>' + Object.keys(names).map((k) => `<h3>${names[k]} (${st[k].length})</h3>
    <table><tr><th>Source</th><th>Why it is included</th><th>Type</th><th>Reliability</th><th>Status</th></tr>
    ${st[k].map((s) => `<tr><td>${esc(s.name)}<br><a href="${esc(s.url)}" target="_blank" class="muted">${esc(s.url.slice(0, 70))}</a></td><td>${esc(s.reason)}</td><td>${esc(s.kind)}</td><td>${s.reliability}</td><td>${esc(s.status)}</td></tr>`).join('') || '<tr><td colspan=5>No sources.</td></tr>'}</table>`).join(''));
}

async function vSources() {
  const rows = await api('/companies/' + cid + '/sources');
  view(`<h2>Source manager</h2>
  <h3>Add a source</h3>
  <div class="row"><label>Category</label><select id="sc"><option>customers</option><option>competitors</option><option>market</option><option>internal</option></select></div>
  <div class="row"><label>Name</label><input type="text" id="sn" size="30"></div>
  <div class="row"><label>URL</label><input type="text" id="su" size="50"></div>
  <div class="row"><label>Reason for monitoring</label><input type="text" id="sr" size="60"></div>
  <div class="row"><button onclick="addSource()">Add and approve</button> <span id="m6"></span></div>
  <h3>All sources</h3>
  <table><tr><th>Category</th><th>Name</th><th>Reason</th><th>Health</th><th>Last checked</th><th>Records</th><th>Status</th><th>Actions</th></tr>
  ${rows.map((s) => `<tr><td>${esc(s.category)}</td><td>${esc(s.name)}<br><a href="${esc(s.url)}" target="_blank" class="muted">${esc(s.url.slice(0, 60))}</a>${s.duplicate_of.length ? '<br><span class="err">duplicate of ' + s.duplicate_of.join(', ') + '</span>' : ''}</td>
  <td>${esc(s.reason)}</td><td>${esc(s.health)}${s.last_error ? '<br><span class="err">' + esc(s.last_error.slice(0, 120)) + '</span>' : ''}${s.fail_count ? '<br>failures: ' + s.fail_count : ''}</td>
  <td>${esc(s.last_checked || '-')}</td><td>${s.item_count}</td><td>${esc(s.status)}</td>
  <td>${s.status !== 'approved' ? `<button onclick="setSrc(${s.id},'approved')">Approve</button>` : ''} ${s.status !== 'removed' ? `<button onclick="setSrc(${s.id},'removed')">Remove</button>` : ''}</td></tr>`).join('')}</table>`);
}
async function addSource() {
  try { await api('/companies/' + cid + '/sources', 'POST', { category: $('sc').value, name: $('sn').value, url: $('su').value, reason: $('sr').value }); vSources(); }
  catch (e) { msg('m6', e.message, true); }
}
async function setSrc(id, status) { await api('/sources/' + id, 'PATCH', { status }); vSources(); }

async function vFeed() {
  view(`<h2>Intelligence feed</h2>
  <div class="row">
    Category <select id="fc"><option value="">all</option><option>customers</option><option>competitors</option><option>market</option><option>internal</option></select>
    Competitor/topic <input type="text" id="fs" size="14">
    Since <input type="text" id="fd" size="10" placeholder="YYYY-MM-DD">
    Min relevance <input type="text" id="fr" size="3"> Min impact <input type="text" id="fi" size="3">
    Verification <select id="fv"><option value="">all</option><option>primary_source</option><option>corroborated</option><option>single_source</option><option>interpretation_only</option><option>unverified</option></select>
    Type <select id="ft"><option value="">all</option><option>opportunity</option><option>threat</option><option>neutral</option></select>
    <button onclick="loadFeed()">Filter</button>
  </div>
  <div class="row"><button onclick="crawlNow()">Crawl approved sources now</button> <button onclick="analyzeNow()">Analyse new records</button>
  <input type="file" id="up"> <button onclick="upload()">Upload internal file</button> <span id="m7"></span></div>
  <div id="feed"></div>`);
  loadFeed();
}
async function loadFeed() {
  const p = new URLSearchParams();
  [['category', 'fc'], ['subject', 'fs'], ['since', 'fd'], ['min_relevance', 'fr'], ['min_impact', 'fi'], ['verification', 'fv'], ['signal_type', 'ft']].forEach(([k, id]) => { if ($(id).value) p.set(k, $(id).value); });
  const rows = await api('/companies/' + cid + '/items?' + p.toString());
  $('feed').innerHTML = `<p class="muted">${rows.length} records</p><table><tr><th>Date</th><th>Category</th><th>Development</th><th>Type</th><th>Rel</th><th>Imp</th><th>Urg</th><th>Score</th><th>Reliability</th><th>Evidence</th><th>Verification</th></tr>
  ${rows.map((r) => `<tr><td>${esc((r.published || r.discovered).slice(0, 10))}</td><td>${esc(r.category)}<br><span class="muted">${esc(r.subject)}</span></td>
  <td><a href="${esc(r.url)}" target="_blank">${esc(r.title)}</a><br><span class="muted">${esc(r.source_name || '')}</span>
  <details><summary>Evidence and analysis</summary><p><b>Snippet:</b> ${esc(r.snippet)}</p>${r.analysis && r.analysis.what_happened ? `<p><b>Reported:</b> ${esc(r.analysis.what_happened)}</p><p><b>Interpretation (model):</b> ${esc(r.analysis.why_it_matters)}</p><p><b>Area:</b> ${esc(r.analysis.business_area)} &nbsp; <b>Suggested response:</b> ${esc(r.analysis.suggested_response)}</p>` : '<p class="muted">Not analysed yet.</p>'}</details></td>
  <td>${esc(r.signal_type || '-')}</td><td>${r.relevance ?? '-'}</td><td>${r.impact ?? '-'}</td><td>${r.urgency ?? '-'}</td><td>${r.score ?? '-'}</td><td>${r.source_reliability ?? '-'}</td><td>${r.evidence_strength ?? '-'}</td><td>${esc(r.verification)}</td></tr>`).join('')}</table>`;
}
async function crawlNow() { try { await api('/companies/' + cid + '/crawl', 'POST'); msg('m7', 'Crawl started. Check Runs and changes for the result.'); } catch (e) { msg('m7', e.message, true); } }
async function analyzeNow() { const r = await busy('m7', 'Analysing', () => api('/companies/' + cid + '/analyze', 'POST')); if (r) { msg('m7', `Analysed ${r.analyzed} records.`); loadFeed(); } }
async function upload() {
  const f = $('up').files[0]; if (!f) { msg('m7', 'Choose a file first.', true); return; }
  const fd = new FormData(); fd.append('file', f);
  const r = await busy('m7', 'Extracting findings', () => api('/companies/' + cid + '/upload', 'POST', fd, true));
  if (r) { msg('m7', `Stored ${r.findings_stored} findings with verbatim quotes. Run analysis to score them.`); loadFeed(); }
}

async function vBrief() {
  const [list, actions] = await Promise.all([api('/companies/' + cid + '/briefs'), api('/companies/' + cid + '/actions')]);
  const briefs = list.filter((b) => b.kind !== 'audit');
  view(`<h2>Monday brief</h2>
  <div class="row"><button onclick="genBrief()">Run weekly pipeline now (crawl, analyse, brief)</button> <span id="m8"></span></div>
  <div class="row">History: <select id="bsel" onchange="showBrief(this.value)">${briefs.map((b) => `<option value="${b.id}">${esc(b.title)} (${esc(b.created.slice(0, 16))})</option>`).join('') || '<option value="">no briefs yet</option>'}</select>
  <span id="bl"></span></div>
  <div id="bv"></div>
  <h3>Action tracking</h3>
  <table><tr><th>Action</th><th>Owner</th><th>Priority</th><th>Reason</th><th>Status</th></tr>
  ${actions.map((a) => `<tr><td>${esc(a.action)}</td><td>${esc(a.owner)}</td><td>${esc(a.priority)}</td><td>${esc(a.reason)}</td><td><select onchange="setAct(${a.id}, this.value)">${['open', 'in_progress', 'done', 'dropped'].map((s) => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('') || '<tr><td colspan=5>No actions.</td></tr>'}</table>`);
  if (briefs.length) showBrief(briefs[0].id);
}
function showBrief(id) {
  if (!id) return;
  $('bl').innerHTML = ` <a href="/api/briefs/${id}/export?format=md">Download markdown</a> | <a href="/api/briefs/${id}/export?format=html" target="_blank">Open email-ready HTML</a>`;
  $('bv').innerHTML = `<iframe src="/api/briefs/${id}/export?format=html"></iframe>`;
}
async function setAct(id, status) { await api('/actions/' + id, 'PATCH', { status }); }
async function genBrief() {
  let runId = null;
  try {
    const res = await api('/companies/' + cid + '/brief', 'POST');
    runId = res.run_id;
    msg('m8', 'Pipeline started (crawling, analysing, generating brief)...');
  } catch (e) { msg('m8', e.message, true); return; }
  timer = setInterval(async () => {
    const runs = await api('/companies/' + cid + '/runs');
    const r = runId ? runs.find((x) => x.id === runId) : runs.find((x) => x.kind === 'weekly_brief');
    if (r && r.status !== 'running') { clearInterval(timer); r.status === 'failed' ? msg('m8', 'Failed: ' + (r.error || '').split('\n')[0], true) : vBrief(); }
  }, 3000);
}

async function vSettings() {
  const d = await api('/companies/' + cid + '/settings');
  const s = d.settings;
  view(`<h2>Settings</h2>
  <div class="row"><label>Briefing day</label><select id="s_briefing_day">${['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].map((x) => `<option ${x === s.briefing_day ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
  <div class="row"><label>Briefing time (HH:MM)</label><input type="text" id="s_briefing_time" value="${esc(s.briefing_time)}"></div>
  <div class="row"><label>Time zone</label><input type="text" id="s_timezone" value="${esc(s.timezone)}"></div>
  <div class="row"><label>Monitoring every (hours)</label><input type="text" id="s_monitoring_frequency_hours" value="${s.monitoring_frequency_hours}"></div>
  <div class="row"><label>Source refresh (days)</label><input type="text" id="s_source_refresh_days" value="${s.source_refresh_days}"></div>
  <div class="row"><label>Brief look-back (days)</label><input type="text" id="s_lookback_days" value="${s.lookback_days}"></div>
  <div class="row"><label>Monthly audit day of month</label><input type="text" id="s_audit_day_of_month" value="${s.audit_day_of_month}"></div>
  <div class="row"><label>Audit time (HH:MM)</label><input type="text" id="s_audit_time" value="${esc(s.audit_time)}"></div>
  <div class="row"><label>Scheduler enabled</label><input type="checkbox" id="s_scheduler_enabled" ${s.scheduler_enabled ? 'checked' : ''}></div>
  <div class="row"><button onclick="saveSettings()">Save</button> <span id="m9"></span></div>
  <h3>Next scheduled runs (UTC)</h3>
  <table><tr><th>Weekly brief</th><th>Monitoring</th><th>Monthly audit</th></tr><tr><td>${esc(d.next_runs.brief || '-')}</td><td>${esc(d.next_runs.monitor || '-')}</td><td>${esc(d.next_runs.audit || '-')}</td></tr></table>
  <h3>Run now</h3>
  <button onclick="runAudit()">Run source-health audit</button> <span id="m10"></span>`);
}
async function saveSettings() {
  const num = ['monitoring_frequency_hours', 'source_refresh_days', 'lookback_days', 'audit_day_of_month'];
  const out = {};
  ['briefing_day', 'briefing_time', 'timezone', 'monitoring_frequency_hours', 'source_refresh_days', 'lookback_days', 'audit_day_of_month', 'audit_time'].forEach((k) => { const v = $('s_' + k).value; out[k] = num.includes(k) ? Number(v) : v; });
  out.scheduler_enabled = $('s_scheduler_enabled').checked;
  try { await api('/companies/' + cid + '/settings', 'PUT', out); msg('m9', 'Saved and rescheduled.'); vSettings(); } catch (e) { msg('m9', e.message, true); }
}
async function runAudit() { try { await api('/companies/' + cid + '/audit', 'POST'); msg('m10', 'Audit started. The report appears in Runs and changes.'); } catch (e) { msg('m10', e.message, true); } }

async function vRuns() {
  const [runs, audits, changes] = await Promise.all([api('/companies/' + cid + '/runs'), api('/companies/' + cid + '/briefs?kind=audit'), api('/companies/' + cid + '/changes')]);
  view(`<h2>Runs and changes</h2>
  <h3>Run log</h3>
  <table><tr><th>Started</th><th>Kind</th><th>Trigger</th><th>Status</th><th>Detail</th></tr>
  ${runs.map((r) => `<tr><td>${esc(r.started)}</td><td>${esc(r.kind)}</td><td>${esc(r.trigger)}</td><td class="${r.status === 'failed' ? 'err' : ''}">${esc(r.status)}</td><td>${esc((r.error || r.summary || '').slice(0, 300))}</td></tr>`).join('') || '<tr><td colspan=5>No runs yet.</td></tr>'}</table>
  <h3>Monthly source-health reports</h3>
  ${audits.map((a) => `<div class="row"><a onclick="showAudit(${a.id})" style="cursor:pointer;color:#00e;text-decoration:underline">${esc(a.title)}</a> ${esc(a.created.slice(0, 16))}</div>`).join('') || '<p class="muted">None yet.</p>'}
  <div id="aud"></div>
  <h3>Context changes</h3>
  ${changes.map((c) => `<div class="row"><b>${esc(c.created.slice(0, 16))}</b>: ${esc(c.note)}${changeHtml(c.result)}</div>`).join('') || '<p class="muted">None.</p>'}`);
}
async function showAudit(id) { const b = await api('/briefs/' + id); $('aud').innerHTML = '<pre>' + esc(b.markdown) + '</pre>'; }

init();
</script>
</body>
</html>
